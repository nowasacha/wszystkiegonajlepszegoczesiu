<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajne Akta nr 22</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:#0f172a;
    color:white;
    line-height:1.6;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    color:#fbbf24;
    font-size:3rem;
    margin-bottom:10px;
}

.hero p{
    color:#cbd5e1;
}

.card{
    background:#1e293b;
    border-radius:16px;
    padding:25px;
    margin-top:20px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.hidden{
    display:none;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#f59e0b;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    margin-top:12px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#d97706;
}

.success{
    color:#22c55e;
}

.clue{
    background:#0f172a;
    border-left:5px solid #fbbf24;
    padding:15px;
    margin:15px 0;
}

.code{
    background:black;
    color:#22c55e;
    font-family:monospace;
    padding:20px;
    border-radius:10px;
    text-align:center;
    letter-spacing:3px;
    font-size:1.3rem;
}

.photo{
    background:#334155;
    border-radius:10px;
    padding:30px;
    text-align:center;
    font-size:1.1rem;
    margin:10px 0;
}

.final-screen{
    text-align:center;
    padding:30px;
}

.address{
    font-size:2.5rem;
    color:#fbbf24;
    font-weight:bold;
    margin:20px 0;
}

.maps-btn{
    display:inline-block;
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:15px 25px;
    border-radius:12px;
    font-weight:bold;
}

.typing{
    font-family:monospace;
    color:#22c55e;
    white-space:pre-line;
}

ul{
    color:#e2e8f0;
}

.fade{
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
    <h1>🔎 TAJNE AKTA NR 22</h1>

    <p>
        Czesiu,<br>
        ktoś ukrył dla Ciebie miejsce, w którym znajduje się kolejna część niespodzianki.
        Udało nam się zabezpieczyć kilka materiałów dowodowych.
        Przeanalizuj je i odnajdź lokalizację.
    </p>
</div>
